# Render blueprint for the DataQuest API.
# In Render: New + > Blueprint, point it at this repository, then fill in the
# environment variables that are marked `sync: false`.
services:
  - type: web
    name: dataquest-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: dataquest
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false